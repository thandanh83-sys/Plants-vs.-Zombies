name: Validate and export Web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate JSON and references
        run: python tools/validate_project.py

  export-web:
    needs: validate-data
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import project resources
        run: godot --headless --editor --path . --quit

      - name: Check project startup
        run: godot --headless --path . --quit-after 3

      - name: Export HTML5 build
        run: mkdir -p build/web && godot --headless --path . --export-release "Web" build/web/index.html

      - name: Upload playable Web export
        uses: actions/upload-artifact@v4
        with:
          name: van-gioi-linh-vien-web
          path: build/web/
          if-no-files-found: error
          retention-days: 14
