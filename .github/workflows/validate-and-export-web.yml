name: Validate and export Web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate JSON and references
        run: python tools/validate_project.py

  export-web:
    needs: validate-data
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import project and reject script parse errors
        shell: bash
        run: |
          godot --headless --editor --path . --quit > godot-import.log 2>&1 || { cat godot-import.log; exit 1; }
          cat godot-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" godot-import.log; then
            exit 1
          fi

      - name: Check project startup
        shell: bash
        run: |
          godot --headless --path . --quit-after 3 > godot-startup.log 2>&1 || { cat godot-startup.log; exit 1; }
          cat godot-startup.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" godot-startup.log; then
            exit 1
          fi

      - name: Install Godot 4.2.2 export templates
        shell: bash
        run: |
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.2.2.stable"
          mkdir -p "$TEMPLATE_DIR"
          if [ ! -f "$TEMPLATE_DIR/web_release.zip" ] || [ ! -f "$TEMPLATE_DIR/web_debug.zip" ]; then
            curl -L --fail --retry 3 -o /tmp/godot-export-templates.tpz https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz
            mkdir -p /tmp/godot-export-templates
            unzip -q /tmp/godot-export-templates.tpz -d /tmp/godot-export-templates
            cp /tmp/godot-export-templates/templates/web_*.zip "$TEMPLATE_DIR/"
          fi
          test -f "$TEMPLATE_DIR/web_release.zip"
          test -f "$TEMPLATE_DIR/web_debug.zip"

      - name: Export HTML5 build
        run: mkdir -p build/web && godot --headless --path . --export-release "Web" build/web/index.html

      - name: Upload playable Web export
        uses: actions/upload-artifact@v4
        with:
          name: van-gioi-linh-vien-web
          path: build/web/
          if-no-files-found: error
          retention-days: 14
