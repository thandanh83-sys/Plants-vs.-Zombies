<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#173d2c">
  <title>$GODOT_PROJECT_NAME</title>
  $GODOT_HEAD_INCLUDE
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #10251c; }
    body { display: grid; place-items: center; }
    #game { width: 100vw; height: 100vh; display: grid; place-items: center; }
    #canvas { width: 100%; height: 100%; object-fit: contain; outline: none; }
    #status { position: fixed; inset: auto 0 18px; text-align: center; color: #e8f3e8; font-size: 14px; pointer-events: none; }
  </style>
</head>
<body>
  <main id="game">
    <canvas id="canvas" width="1280" height="720" oncontextmenu="event.preventDefault();"></canvas>
  </main>
  <div id="status" role="status">Đang tải Vạn Giới Linh Viên…</div>
  <script src="$GODOT_URL"></script>
  <script>
    const GODOT_CONFIG = $GODOT_CONFIG;
    const statusElement = document.getElementById("status");
    const engine = new Engine(GODOT_CONFIG);
    engine.startGame({
      onProgress: function (current, total) {
        if (total > 0) {
          statusElement.textContent = "Đang tải… " + Math.round(current / total * 100) + "%";
        }
      }
    }).then(function () {
      statusElement.remove();
    }).catch(function (error) {
      statusElement.textContent = "Không thể khởi động trò chơi. Hãy kiểm tra file export và Console.";
      console.error(error);
    });
  </script>
</body>
</html>
